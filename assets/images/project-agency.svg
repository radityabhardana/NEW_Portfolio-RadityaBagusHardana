  <text x="170" y="434" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Konsultasi Gratis →</text>

  <rect x="280" y="405" width="160" height="46" rx="23" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="360" y="434" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Lihat Portofolio</text>

  <!-- Right Visual Bento Card Mockup -->
  <rect x="680" y="150" width="440" height="460" rx="20" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <rect x="705" y="180" width="390" height="120" rx="14" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <circle cx="735" cy="210" r="14" fill="#3b82f6"/>
  <text x="765" y="215" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Fast &amp; Responsive UI</text>
  <text x="765" y="240" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#94a3b8">100% Mobile Optimized dengan Tailwind CSS</text>
  <rect x="765" y="258" width="80" height="20" rx="10" fill="#0f172a"/>
  <text x="805" y="272" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Score 99/100</text>

  <rect x="705" y="320" width="185" height="130" rx="14" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <circle cx="735" cy="350" r="14" fill="#10b981"/>
  <text x="765" y="355" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Clean Code</text>
  <text x="735" y="390" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">Struktur modular, mudah dirawat dan dikembangkan.</text>

  <rect x="910" y="320" width="185" height="130" rx="14" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
  <circle cx="940" cy="350" r="14" fill="#8b5cf6"/>
  <text x="970" y="355" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">SEO Ready</text>
  <text x="940" y="390" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8">Schema markup lengkap &amp; terindeks Google cepat.</text>

  <rect x="705" y="470" width="390" height="110" rx="14" fill="url(#accentDev)" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="900" y="515" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">10+ Klien &amp; UMKM Puas</text>
  <text x="900" y="542" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Garansi pengerjaan rapi, revisi fleksibel &amp; support berkala</text>
