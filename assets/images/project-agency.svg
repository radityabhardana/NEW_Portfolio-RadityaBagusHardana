<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accentDev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" rx="16" fill="url(#bgDev)" />
  
  <!-- Subtle Glow mesh behind hero -->
  <circle cx="350" cy="280" r="180" fill="#2563eb" opacity="0.18" filter="url(#glow)"/>
  <circle cx="850" cy="380" r="160" fill="#06b6d4" opacity="0.14" filter="url(#glow)"/>

  <!-- Browser/Window Mockup Top Bar -->
  <rect width="1200" height="42" fill="#1e293b" opacity="0.6"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="250" y="9" width="700" height="24" rx="12" fill="#0b0f19" opacity="0.8" />
  <text x="600" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">https://raditya-studio.dev</text>

  <!-- Navbar -->
  <text x="80" y="95" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">RADITYA<tspan fill="#38bdf8">.DEV</tspan></text>
  <text x="500" y="92" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#94a3b8">Services</text>
  <text x="600" y="92" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#94a3b8">Portfolio</text>
  <text x="700" y="92" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#94a3b8">Pricing</text>
  <text x="800" y="92" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#94a3b8">About</text>
  
  <rect x="1000" y="72" width="120" height="34" rx="17" fill="url(#accentDev)" />
  <text x="1060" y="94" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Start Project</text>

  <!-- Hero Content -->
  <rect x="80" y="145" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="96" cy="159" r="4" fill="#10b981"/>
  <text x="110" y="164" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">CREATIVE WEB AGENCY</text>

  <text x="80" y="235" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-1">Membangun Website</text>
  <text x="80" y="295" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#accentDev)" letter-spacing="-1">Modern &amp; Berkonversi Tinggi</text>

  <text x="80" y="340" font-family="'Inter', system-ui, sans-serif" font-size="17" fill="#94a3b8">Layanan jasa pembuatan website personal, UMKM, dan landing page startup</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="17" fill="#94a3b8">dengan optimasi SEO, desain interaktif, dan performa ultra cepat.</text>

